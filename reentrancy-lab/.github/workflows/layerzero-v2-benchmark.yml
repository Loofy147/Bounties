name: LayerZero V2 Benchmark

on:
  push:
    paths:
      - 'reentrancy-lab/contracts/layerzero_v2/**'
      - 'reentrancy-lab/test/layerzero_v2_boundary.js'
      - 'reentrancy-lab/package.json'
      - 'reentrancy-lab/package-lock.json'
      - '.github/workflows/layerzero-v2-benchmark.yml'
  pull_request:
    paths:
      - 'reentrancy-lab/contracts/layerzero_v2/**'
      - 'reentrancy-lab/test/layerzero_v2_boundary.js'
      - 'reentrancy-lab/package.json'
      - 'reentrancy-lab/package-lock.json'
      - '.github/workflows/layerzero-v2-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reentrancy-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: reentrancy-lab/package.json

      - name: Install dependencies
        run: npm install

      - name: Run LayerZero V2 boundary benchmark
        run: npm test
