name: SSV reference-model tests

on:
  pull_request:
    paths:
      - "targets/ssv-network/**"
      - "research/ssv-v2-transition-model/**"
      - ".github/workflows/ssv-invariant-model.yml"
  push:
    branches: [main]
    paths:
      - "targets/ssv-network/**"
      - "research/ssv-v2-transition-model/**"
      - ".github/workflows/ssv-invariant-model.yml"

jobs:
  reference-model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Run dependency-free reference model tests
        working-directory: research/ssv-v2-transition-model
        run: python -m unittest -v
