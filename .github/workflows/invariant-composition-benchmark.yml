name: Invariant Composition Benchmark

on:
  pull_request:
    paths:
      - "research/benchmarks/invariant-composition-v0.1/**"
      - ".github/workflows/invariant-composition-benchmark.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "research/benchmarks/invariant-composition-v0.1/**"
      - ".github/workflows/invariant-composition-benchmark.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: research/benchmarks/invariant-composition-v0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest -v
      - name: Run seeded-defect benchmark
        run: python run_benchmark.py
