name: Evidence Gate Layer

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "docs/EVIDENCE_GATE_LAYER_v0.1.md"
      - ".github/workflows/evidence-gate.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "docs/EVIDENCE_GATE_LAYER_v0.1.md"
      - ".github/workflows/evidence-gate.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example record validation
        run: python -m tools.bounty_gate examples/claim-record.example.json --root . --pretty
