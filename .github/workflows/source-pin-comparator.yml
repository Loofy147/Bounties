name: Verified source comparator

on:
  push:
    paths:
      - "tools/source_pin/**"
      - ".github/workflows/source-pin-comparator.yml"
  pull_request:
    paths:
      - "tools/source_pin/**"
      - ".github/workflows/source-pin-comparator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline source-pin comparator tests
        run: python -m unittest discover -s tools/source_pin -p "test_*.py" -v
