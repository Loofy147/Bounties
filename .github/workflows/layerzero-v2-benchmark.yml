name: LayerZero V2 Benchmark

on:
  push:
    paths:
      - 'reentrancy-lab/contracts/layerzero_v2/**'
      - 'reentrancy-lab/test/layerzero_v2_boundary.js'
      - 'reentrancy-lab/package.json'
      - 'reentrancy-lab/tools/layerzero_effective_config.py'
      - 'reentrancy-lab/test/test_layerzero_config_resolver.py'
      - 'reentrancy-lab/test/data/layerzero_config_*.json'
      - 'reentrancy-lab/tools/validate_layerzero_snapshot.py'
      - 'reentrancy-lab/test/test_layerzero_snapshot_validator.py'
      - 'reentrancy-lab/test/data/iota_lockbox_snapshot_template.json'
      - '.github/workflows/layerzero-v2-benchmark.yml'
  pull_request:
    paths:
      - 'reentrancy-lab/contracts/layerzero_v2/**'
      - 'reentrancy-lab/test/layerzero_v2_boundary.js'
      - 'reentrancy-lab/package.json'
      - 'reentrancy-lab/package-lock.json'
      - 'reentrancy-lab/tools/layerzero_effective_config.py'
      - 'reentrancy-lab/test/test_layerzero_config_resolver.py'
      - 'reentrancy-lab/test/data/layerzero_config_*.json'
      - 'reentrancy-lab/tools/validate_layerzero_snapshot.py'
      - 'reentrancy-lab/test/test_layerzero_snapshot_validator.py'
      - 'reentrancy-lab/test/data/iota_lockbox_snapshot_template.json'
      - '.github/workflows/layerzero-v2-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reentrancy-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run LayerZero V2 boundary benchmark
        run: npm test

      - name: Run effective LayerZero configuration resolver regression
        run: python3 test/test_layerzero_config_resolver.py

      - name: Run local-fork snapshot validator regression
        run: python3 test/test_layerzero_snapshot_validator.py
